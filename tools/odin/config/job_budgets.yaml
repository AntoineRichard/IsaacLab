gpu_multipliers:
  default: 3.0  # very generous — better to over-budget an unknown GPU
                # than to silently kill a job that needed a couple more
                # hours. Tighten once a calibration run lands.
  blackwell-pro-5000: 1.0  # baseline (this run)
  l40s: 1.0   # calibrated from 20260513-092728 OSMO L40s run vs
              # the same tasks on Blackwell. Mixed picture: short
              # tasks (Cartpole) are ~2x slower on L40s, long tasks
              # (Ant/Humanoid/Anymal-C) are 0.4-0.8x. The per-task
              # budget already carries a 1.5x safety margin baked
              # into max-observed-Blackwell, so keeping the L40s
              # multiplier at 1.0 covers Cartpole's worst case
              # (~2x slower) within the safety margin while not
              # over-budgeting long tasks.
  # add more once we have calibration data on other GPUs:
  # l40: 1.4
  # a100: 0.9
