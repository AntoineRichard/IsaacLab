# Auto-generated from dispatch 20260430-110509 by ad-hoc analysis.
# Per-task budgets = max-observed-duration × 1.5, rounded up to nearest 5 min.
# Hand-set values for tasks that timed out without completing.

defaults:
  rsl_rl: 43200  # 12h fallback — generous for unlisted tasks; bump if you
  skrl: 43200    # know a task is going to need more, otherwise tight enough.

